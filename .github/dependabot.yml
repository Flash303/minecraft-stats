version: 2

# Dependabot ne lit ce fichier que sur la branche par défaut (main) :
# toute modification doit être mergée dans main pour prendre effet.
# Les PR ciblent `dev`, comme celles de update-protocols.yml.

updates:
  # Frontend — Bun (package.json + bun.lock)
  - package-ecosystem: "bun"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Les mises à jour mineures/patchs sont regroupées pour limiter le bruit.
      frontend-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Les majeures restent manuelles (React Router, React, Vite…).
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Backend — Rust (workspace Cargo)
  - package-ecosystem: "cargo"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
      backend-minor:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Images de base des Dockerfiles.
  # La découverte n'est PAS récursive : un `directory` par Dockerfile.
  - package-ecosystem: "docker"
    directory: "/deploy/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directory: "/deploy/rest-api"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Le tag `rust` doit rester aligné sur dtolnay/rust-toolchain dans
      # ci.yml : montée manuelle, les deux fichiers en même temps.
      - dependency-name: "rust"

  - package-ecosystem: "docker"
    directory: "/deploy/worker"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Idem rest-api : aligné sur ci.yml.
      - dependency-name: "rust"

  # Images référencées dans docker-compose.yml.
  # Écosystème distinct de `docker` : `docker` ne lit que les Dockerfiles.
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      compose-images:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Les montées majeures (PostgreSQL/TimescaleDB, Grafana, Loki) sont
      # volontairement manuelles : elles demandent une validation en staging.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor/patch groupés ; les majeures arrivent une par une pour être
      # relues (changement de runtime Node, breaking changes du runner).
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Le tag de dtolnay/rust-toolchain doit rester aligné sur les images
      # `rust:1.98.1-alpine3.24` de deploy/. Dependabot propose 1.120.0 alors
      # que la dernière release stable est 1.99.1 : montée manuelle, avec les
      # Dockerfiles, pour éviter que la CI compile avec un autre compilateur
      # que celui qui produit l'image.
      - dependency-name: "dtolnay/rust-toolchain"
