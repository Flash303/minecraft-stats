name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Le tag de l'image Docker est la source de vérité de la version de Bun :
      # Dependabot met à jour deploy/frontend/Dockerfile, la CI suit toute seule.
      - name: Resolve Bun version from deploy/frontend/Dockerfile
        id: bun
        working-directory: .
        run: |
          version=$(grep -m1 -oP 'FROM oven/bun:\K[0-9]+\.[0-9]+\.[0-9]+' deploy/frontend/Dockerfile)
          test -n "$version" || { echo "::error::aucun tag oven/bun:x.y.z dans deploy/frontend/Dockerfile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo check --workspace --all-targets --locked --manifest-path backend/Cargo.toml
