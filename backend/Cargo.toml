[workspace]
resolver = "3"
members = ["worker", "rest-api"]

[workspace.dependencies]
minecraft-pinger = { git = "https://github.com/Flash303/minecraft-pinger" }
repository = { path = "./crates/repository" }

log = "0.4.*"
env_logger = "0.11.*"
thiserror = "2.0.*"

futures = "0.3.*"

tokio = { version = "1.53.*", features = ["full"] }

serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"

time = { version = "0.3.*", features = ["serde", "formatting"] }
sha2 = "0.11.*"

openssl = { version = "0.10.*", features = ["vendored"] }

# Only crates/repository
sqlx = { version = "0.9.0", features = ["time", "postgres"] }

hickory-resolver = { version = "0.26.*", features = ["tokio"] }
hickory-proto = "0.26.*"

async-trait = "0.1.*"
hex = "0.4.*"
regex = "1.13.*"

# Only worker
web-push = "0.11.*"

# Only rest-api
tower-http = { version = "0.7.*", features = ["cors", "compression-full"] }
reqwest = { version = "0.13.*", features = ["json"] }
axum = { version = "0.8.*", features = ["tokio"] }

base64 = "0.23.*"
rsa = "0.10.0-rc.18"
tower_governor = "0.8.*"

chrono = "0.4.*"